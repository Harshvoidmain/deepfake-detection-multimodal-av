project_name: deepfake_detection
experiment_name: smoke_test_5_epochs
seed: 42
data:
  raw_dir: data/raw
  processed_dir: data/processed
  video_extensions:
  - .mp4
  - .avi
  - .mov
  - .mkv
  audio_sample_rate: 16000
  video_fps: 30
  frame_size: 196
  num_frames: 8
  clip_duration: 2.0
model:
  name: MultimodalAVDetector
  visual:
    backbone: dinov2_vits14
    pretrained: true
    freeze_backbone: false
    embed_dim: 384
  temporal:
    type: video_swin
    num_layers: 4
    num_heads: 6
    dropout: 0.1
  audio:
    backbone: wav2vec2
    pretrained: true
    freeze_backbone: false
    embed_dim: 768
  frequency:
    wavelet_type: db8
    levels: 3
    bands:
    - LL
    - LH
    - HL
    - HH
  fusion:
    type: cross_attention
    hidden_dim: 512
    num_heads: 8
    dropout: 0.15
  classifier:
    hidden_dims:
    - 256
    - 128
    dropout: 0.2
    num_classes: 2
training:
  batch_size: 2
  num_epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 5
  loss:
    type: cross_entropy
    label_smoothing: 0.1
  augmentation:
    horizontal_flip: true
    color_jitter: true
    gaussian_blur: true
    compression_emulation: true
    compression_quality:
    - 70
    - 95
validation:
  batch_size: 4
  split_ratio: 0.2
  eval_frequency: 1
testing:
  batch_size: 16
  tta: false
  threshold: 0.5
explainability:
  enabled: true
  methods:
  - gradcam
  - shap
  save_visualizations: true
  visualization_dir: logs/visualizations
logging:
  use_wandb: false
  wandb_project: deepfake-detection
  log_frequency: 10
  checkpoint_dir: checkpoints/smoke_test
  save_frequency: 1
  keep_last_n: 3
hardware:
  device: cuda
  num_workers: 2
  pin_memory: true
  mixed_precision: true
  compile_model: false
paths:
  pretrained_models: models/pretrained
  outputs: outputs
  logs: logs/smoke_test
