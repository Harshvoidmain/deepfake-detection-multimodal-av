name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml

      - name: Lint (ruff)
        run: ruff check .

      - name: Syntax check
        run: |
          python -m py_compile train.py
          python -m py_compile inference.py
          python -m py_compile quickstart.py
          python -m py_compile prepare_celebdf.py
          python -m py_compile models/model.py
          python -m py_compile utils/dataset.py
